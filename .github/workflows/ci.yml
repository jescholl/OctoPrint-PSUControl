name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Called by the Release workflow, so a release is only ever cut from a commit whose tests passed.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the *caller's* name when called from Release, so the two never share a group.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (OctoPrint ${{ matrix.octoprint }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is what the deployed OctoPrint container runs; 3.13 is the newest both OctoPrint lines support.
        python: ["3.10", "3.13"]
        octoprint: ["1.11.8", "2.0.0rc5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # The tests run a real OctoPrint against the plugin, so OctoPrint is a test dependency, not a
      # dependency of the package. setup.py imports octoprint_setuptools, hence no build isolation.
      - name: Install OctoPrint ${{ matrix.octoprint }} and the plugin
        run: |
          python -m pip install --upgrade pip wheel "setuptools<81"
          python -m pip install --pre "octoprint==${{ matrix.octoprint }}" -r tests/requirements.txt
          python -m pip install -e . --no-build-isolation
      - name: Test
        env:
          PSUCONTROL_TEST_LOGS: ${{ runner.temp }}/octoprint-test-logs
        run: python -m pytest tests -v --tb=short
      - name: Keep the OctoPrint logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: octoprint-logs-${{ matrix.octoprint }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/octoprint-test-logs
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff==0.16.8"
      # Pyflakes (F: undefined names, unused imports) and syntax errors (E9) only. There are no style
      # rules on purpose: this is a legacy codebase and a formatter would bury real changes. F841
      # (unused local) is ignored because upstream leaves one in on_settings_save.
      - run: ruff check --select F,E9 --ignore F841 octoprint_psucontrol tests setup.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install "bandit==1.9.4"
      # B602 (subprocess with shell=True) is skipped on purpose: "System Command" switching and
      # sensing exist to run the shell command the user configures. Everything else at medium
      # severity or above still fails the build.
      - run: bandit -q -r octoprint_psucontrol -ll -s B602

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip wheel "setuptools<81" "octoprint==1.11.8"
      - run: python setup.py sdist bdist_wheel
      # The Release workflow publishes exactly what this builds, so prove it is installable and
      # actually contains the templates and JavaScript the plugin needs.
      - name: The wheel installs and ships what the plugin needs
        run: |
          python -m pip install --dry-run --no-deps dist/*.whl
          unzip -l dist/*.whl > wheel-contents.txt
          for f in octoprint_psucontrol/__init__.py \
                   octoprint_psucontrol/templates/psucontrol_settings.jinja2 \
                   octoprint_psucontrol/static/js/psucontrol.js; do
            grep -q "$f" wheel-contents.txt || { echo "missing from the wheel: $f"; exit 1; }
          done
